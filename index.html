<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            background-color: aliceblue;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .header {
            color: steelblue;
            font-size: larger;
            text-align: center;
            justify-content: center;
            margin-top: 40px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10 rgba(145, 140, 140, 0);
            background-color: rgba(70, 131, 180, 0.4);
        }

        h2 {
            font-size: 20px;
        }

        input {
            width: 60%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid whitesmoke;
        }

        button {
            background-color: steelblue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 13px;
            cursor: pointer;
            font-weight: 400;
        }

        .weather {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Weather App</h1>
    </div>

    <div class="container">
        <input type="text" id="locationInput" placeholder="Enter your city name">

        <button id="searchBtn">Search</button>

        <div class="weather" id="weatherCard">
            <h2 id="location"></h2>
            <p id="temperature"></p>
            <p id="desciption"></p>
            <p id="icon"></p>
        </div>
    </div>

    <script type="text/javascript" src="script.js"></script>
</body>
</html>
