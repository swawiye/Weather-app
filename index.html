<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Weather App</h1>
    </div>

    <div class="container">
        <input type="text" id="locationInput" placeholder="Enter your city name">

        <button id="searchBtn">Search</button>

        <div class="weather" id="weatherCard">
            <h2 id="location"></h2>
            <p id="temperature"></p>
            <p id="desciption"></p>
        </div>
    </div>

    <script type="text/javascript" src="script.js"></script>
</body>
</html>
